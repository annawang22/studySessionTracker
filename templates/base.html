<!DOCTYPE html>
<html>

<head>
    <title>Study Session Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        nav {
            margin-bottom: 20px;
        }

        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: blue;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        /* th - header cells, td - data cells */
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>
    <h1>Study Session Tracker</h1>

    <nav>
        <a href="/">View Sessions</a>
        <a href="/add">Add Session</a>
    </nav>

    <!-- allows this to show on all pages, anything after is unique-->
    {% block content %}{% endblock %} 

</body>
</html>
